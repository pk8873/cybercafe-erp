services:
  - type: web
    name: cybercafe-erp
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: 'true'

databases:
  - name: cybercafe_db
    databaseName: cybercafe_erp
    user: cybercafe_user

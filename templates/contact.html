{% extends 'base.html' %}

{% block title %}संपर्क करें - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold mb-8">हमसे संपर्क करें</h1>
    
    <div class="max-w-2xl">
        <form method="POST" class="space-y-4 bg-white p-8 rounded-lg shadow">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">नाम</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ईमेल</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">फोन</label>
                <input type="tel" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">संदेश</label>
                <textarea name="message" rows="5" required class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700">भेजें</button>
        </form>
    </div>
</div>
{% endblock %}

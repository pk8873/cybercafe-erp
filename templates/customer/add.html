{% extends "base.html" %}

{% block title %}ग्राहक जोड़ें - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold mb-6 text-green-600">नया ग्राहक जोड़ें</h1>
        
        <form method="POST" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2">पूरा नाम *</label>
                    <input type="text" name="full_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">मोबाइल नंबर *</label>
                    <input type="tel" name="mobile" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">आधार अंतिम 4 अंक</label>
                    <input type="text" name="aadhaar_last4" maxlength="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">जिला</label>
                    <select name="district" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                        <option value="">चुनें</option>
                        {% for district in districts %}
                            <option value="{{ district }}">{{ district }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">गांव</label>
                <input type="text" name="village" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">पता</label>
                <textarea name="address" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" rows="3"></textarea>
            </div>
            
            <div class="flex gap-4 flex-wrap">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
                    जोड़ें
                </button>
                <a href="{{ url_for('customer.list') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-500">
                    रद्द करें
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

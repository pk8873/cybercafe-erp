{% extends "base.html" %}

{% block title %}PDF उपकरण - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<h1 class="text-3xl md:text-4xl font-bold mb-8">PDF उपकरण</h1>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition">
        <i class="fas fa-expand text-2xl text-blue-600 mb-4"></i>
        <h3 class="font-bold text-lg mb-2">छवि संपीड़न</h3>
        <p class="text-gray-600 text-sm mb-4">छवियों को संपीड़ित करें</p>
        <button class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">शीघ्र आ रहा है</button>
    </div>
    
    <div class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition">
        <i class="fas fa-crop text-2xl text-purple-600 mb-4"></i>
        <h3 class="font-bold text-lg mb-2">पासपोर्ट फोटो क्रॉप</h3>
        <p class="text-gray-600 text-sm mb-4">पासपोर्ट आकार की फोटो</p>
        <button class="w-full bg-purple-600 text-white py-2 rounded font-bold hover:bg-purple-700">शीघ्र आ रहा है</button>
    </div>
    
    <div class="bg-white p-6 rounded-lg shadow-lg hover:shadow-xl transition">
        <i class="fas fa-file-pdf text-2xl text-red-600 mb-4"></i>
        <h3 class="font-bold text-lg mb-2">PDF विलय</h3>
        <p class="text-gray-600 text-sm mb-4">एकाधिक PDF को विलय करें</p>
        <button class="w-full bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700">शीघ्र आ रहा है</button>
    </div>
</div>
{% endblock %}

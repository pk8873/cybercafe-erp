{% extends "base.html" %}

{% block content %}

<div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
    <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
        <div>
            <p class="text-gray-600 text-sm">आज की आय</p>
            <p class="text-3xl font-bold text-green-600">₹{{ earnings|int }}</p>

        <button class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
            <i class="fas fa-download mr-2"></i>डाउनलोड करें

    </div>

{% endblock %}

{% extends "base.html" %}

{% block title %}एडमिन डैशबोर्ड - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<h1 class="text-3xl md:text-4xl font-bold mb-8 text-red-600">एडमिन डैशबोर्ड</h1>

<div class="grid md:grid-cols-3 gap-6 mb-8">
    <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-lg shadow-lg">
        <p class="text-sm opacity-90">कुल ऑपरेटर</p>
        <p class="text-3xl font-bold">{{ total_operators }}</p>
    </div>
    
    <div class="bg-gradient-to-br from-green-500 to-green-600 text-white p-6 rounded-lg shadow-lg">
        <p class="text-sm opacity-90">सक्रिय ऑपरेटर</p>
        <p class="text-3xl font-bold">{{ active_operators }}</p>
    </div>
    
    <div class="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-6 rounded-lg shadow-lg">
        <p class="text-sm opacity-90">कुल राजस्व</p>
        <p class="text-3xl font-bold">₹{{ total_revenue|int }}</p>
    </div>
</div>

<div class="flex gap-4 flex-wrap">
    <a href="{{ url_for('admin.logout') }}" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700">
        लॉगआउट
    </a>
</div>
{% endblock %}

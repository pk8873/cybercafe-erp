{% extends "base.html" %}

{% block title %}एडमिन लॉगिन - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center mb-6 text-red-600">एडमिन पैनल</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-2">यूजरनेम</label>
                <input type="text" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600" required>
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">पासवर्ड</label>
                <input type="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600" required>
            </div>
            
            <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition">
                लॉगिन
            </button>
        </form>
    </div>
</div>
{% endblock %}

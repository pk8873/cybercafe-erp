{% extends "base.html" %}

{% block title %}रजिस्ट्रेशन - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-center mb-6 text-green-600">रजिस्ट्रेशन</h1>
        
        <form method="POST" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2">पूरा नाम *</label>
                    <input type="text" name="full_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">दुकान का नाम *</label>
                    <input type="text" name="shop_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">मोबाइल नंबर *</label>
                    <input type="tel" name="mobile" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">ईमेल *</label>
                    <input type="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">जिला *</label>
                    <select name="district" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                        <option value="">चुनें</option>
                        {% for district in districts %}
                            <option value="{{ district }}">{{ district }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">पासवर्ड *</label>
                    <input type="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">पता</label>
                <textarea name="address" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" rows="3"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">
                रजिस्ट्रेशन करें
            </button>
        </form>
        
        <p class="text-center mt-6 text-sm">
            पहले से खाता है? <a href="{{ url_for('auth.login') }}" class="text-green-600 font-bold hover:underline">लॉगिन करें</a>
        </p>
    </div>
</div>
{% endblock %}

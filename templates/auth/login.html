{% extends 'base.html' %}

{% block title %}लॉगिन - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center text-green-600 mb-6">लॉगिन करें</h2>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ईमेल</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="your@email.com">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">पासवर्ड</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="••••••••">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" name="remember_me" id="remember" class="h-4 w-4 text-green-600">
                <label for="remember" class="ml-2 block text-sm text-gray-700">मुझे याद रखें</label>
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">लॉगिन करें</button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">खाता नहीं है? <a href="{{ url_for('auth.register') }}" class="text-green-600 hover:text-green-700 font-bold">रजिस्टर करें</a></p>
            <p class="mt-2"><a href="{{ url_for('auth.forgot_password') }}" class="text-green-600 hover:text-green-700 text-sm">पासवर्ड भूल गए?</a></p>
        </div>
    </div>
</div>
{% endblock %}

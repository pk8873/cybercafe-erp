{% extends 'base.html' %}

{% block title %}नई सेवा जोड़ें{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <h1 class="text-3xl font-bold mb-6">नई सेवा जोड़ें</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ग्राहक चुनें *</label>
                <select name="customer_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">--ग्राहक चुनें--</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.full_name }} ({{ customer.mobile }})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">सेवा प्रकार *</label>
                <select name="service_type" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">--सेवा प्रकार चुनें--</option>
                    {% for service_type in service_types %}
                    <option value="{{ service_type }}">{{ service_type }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">राशि (₹) *</label>
                <input type="number" name="payment_amount" step="0.01" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">विवरण</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">नोट्स</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">जोड़ें</button>
                <a href="{{ url_for('service.index') }}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-400">रद्द करें</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

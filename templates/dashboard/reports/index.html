{% extends 'base.html' %}

{% block title %}रिपोर्ट{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">आय रिपोर्ट</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <a href="{{ url_for('reports.daily_report') }}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition cursor-pointer">
            <div class="text-4xl mb-3">📅</div>
            <h3 class="text-xl font-bold mb-2">दैनिक रिपोर्ट</h3>
            <p class="text-gray-600 text-sm">आज की दैनिक आय रिपोर्ट देखें</p>
        </a>
        
        <a href="{{ url_for('reports.monthly_report') }}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition cursor-pointer">
            <div class="text-4xl mb-3">📊</div>
            <h3 class="text-xl font-bold mb-2">मासिक रिपोर्ट</h3>
            <p class="text-gray-600 text-sm">इस महीने की विस्तृत आय रिपोर्ट</p>
        </a>
        
        <a href="#" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition cursor-pointer">
            <div class="text-4xl mb-3">📈</div>
            <h3 class="text-xl font-bold mb-2">वर्षिक रिपोर्ट</h3>
            <p class="text-gray-600 text-sm">साल भर की विश्लेषण रिपोर्ट (जल्द आ रही है)</p>
        </a>
    </div>
</div>
{% endblock %}

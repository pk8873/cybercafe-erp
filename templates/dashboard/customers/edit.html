{% extends 'base.html' %}

{% block title %}ग्राहक संपादित करें{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <h1 class="text-3xl font-bold mb-6">ग्राहक संपादित करें</h1>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">पूरा नाम *</label>
                <input type="text" name="full_name" value="{{ customer.full_name }}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">मोबाइल नंबर *</label>
                <input type="tel" name="mobile" value="{{ customer.mobile }}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">आधार अंतिम 4 अंक</label>
                <input type="text" name="aadhaar_last4" value="{{ customer.aadhaar_last4 or '' }}" maxlength="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">पता</label>
                <textarea name="address" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg">{{ customer.address or '' }}</textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">गांव/मोहल्ला</label>
                <input type="text" name="village" value="{{ customer.village or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">जिला</label>
                <input type="text" name="district" value="{{ customer.district or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">नोट्स</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg">{{ customer.notes or '' }}</textarea>
            </div>
            
            <div class="flex gap-4">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">अपडेट करें</button>
                <a href="{{ url_for('customer.view', customer_id=customer.id) }}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg font-bold hover:bg-gray-400">रद्द करें</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

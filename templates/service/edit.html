{% extends "base.html" %}

{% block title %}सेवा संपादित करें - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold mb-6 text-green-600">सेवा संपादित करें</h1>
        
        <form method="POST" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2">सेवा प्रकार</label>
                    <select name="service_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                        {% for service_type in service_types %}
                            <option value="{{ service_type }}" {% if service.service_type == service_type %}selected{% endif %}>{{ service_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">राशि (₹)</label>
                    <input type="number" name="payment_amount" step="0.01" value="{{ service.payment_amount }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">स्थिति</label>
                    <select name="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600">
                        <option value="Pending" {% if service.status == 'Pending' %}selected{% endif %}>लंबित</option>
                        <option value="Submitted" {% if service.status == 'Submitted' %}selected{% endif %}>प्रस्तुत</option>
                        <option value="Approved" {% if service.status == 'Approved' %}selected{% endif %}>स्वीकृत</option>
                        <option value="Rejected" {% if service.status == 'Rejected' %}selected{% endif %}>अस्वीकृत</option>
                        <option value="Completed" {% if service.status == 'Completed' %}selected{% endif %}>पूर्ण</option>
                    </select>
                </div>
            </div>
            
            <div class="flex gap-4 flex-wrap">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
                    अपडेट करें
                </button>
                <a href="{{ url_for('service.list') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-500">
                    रद्द करें
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}सेवा जोड़ें - साइबर कैफे मैनेजर{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold mb-6 text-green-600">नई सेवा जोड़ें</h1>
        
        <form method="POST" class="space-y-4">
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-2">ग्राहक *</label>
                    <select name="customer_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                        <option value="">चुनें</option>
                        {% for customer in customers %}
                            <option value="{{ customer.id }}">{{ customer.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">सेवा प्रकार *</label>
                    <select name="service_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                        <option value="">चुनें</option>
                        {% for service_type in service_types %}
                            <option value="{{ service_type }}">{{ service_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold mb-2">राशि (₹) *</label>
                    <input type="number" name="payment_amount" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" required>
                </div>
            </div>
            
            <div class="flex gap-4 flex-wrap">
                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
                    जोड़ें
                </button>
                <a href="{{ url_for('service.list') }}" class="bg-gray-400 text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-500">
                    रद्द करें
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

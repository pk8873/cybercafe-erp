{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto text-center py-12">
    <h1 class="text-6xl font-bold text-red-600 mb-4">500</h1>
    <p class="text-2xl text-gray-600 mb-2">सर्वर त्रुटि</p>
    <p class="text-gray-500 mb-6">कृपया बाद में पुनः प्रयास करें</p>
    {% if error %}
    <p class="text-sm text-gray-400 mb-6 bg-gray-100 p-4 rounded">{{ error }}</p>
    {% endif %}
    <a href="{{ url_for('index') }}" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">
        होम पर जाएं
    </a>
</div>
{% endblock %}
